<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --sunken: #eef0f3; --line: #e2e5ea;
    --text: #1b1f24; --muted: #6a7280; --faint: #9aa1ac;
    --accent: #3b5bdb;
    --pass: #2f9e44; --pass-bg: #e6f4ea;
    --changes: #d9480f; --changes-bg: #fdece4;
    --human: #e8a200; --human-bg: #fff6dc;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --panel: #1a1d21; --sunken: #15181b; --line: #2a2f35;
      --text: #e6e8eb; --muted: #9aa1ac; --faint: #6a7280;
      --accent: #7b93f5;
      --pass: #51cf66; --pass-bg: #1d3324;
      --changes: #ff8a4c; --changes-bg: #3a2218;
      --human: #ffc53d; --human-bg: #332a12;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 20px 24px 8px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .live { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); }
  .dot.stale { background: var(--changes); }

  .board {
    display: grid; grid-template-columns: repeat(6, minmax(212px, 1fr));
    gap: 12px; padding: 12px 24px 24px; overflow-x: auto; align-items: start;
  }
  .col { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; min-height: 160px; }
  .col.human { background: var(--human-bg); border-color: var(--human); }
  .col-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted);
  }
  .col-head .who { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--faint); }
  .count { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; font-size: 11px; color: var(--text); }
  .cards { display: grid; gap: 8px; padding: 0 8px 8px; }
  .empty-col { color: var(--faint); font-size: 12px; text-align: center; padding: 16px 0; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 11px; box-shadow: var(--shadow); cursor: pointer; text-align: left;
    font: inherit; color: inherit; width: 100%; min-width: 0; overflow-wrap: anywhere;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
  .card.human { border: 1.5px solid var(--human); box-shadow: 0 0 0 3px var(--human-bg), var(--shadow); }
  .card .id { font: 11px var(--mono); color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 6px; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .note { font-size: 12px; margin-top: 6px; color: var(--text); }
  .card.human .note::before { content: "Needs you: "; font-weight: 600; color: var(--human); }

  .rounds { display: grid; gap: 4px; margin-top: 8px; }
  .round { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .round .r { font: 10px var(--mono); color: var(--faint); width: 18px; }
  .chip {
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--faint); background: var(--panel);
  }
  .chip.PASS { color: var(--pass); background: var(--pass-bg); border-color: transparent; }
  .chip.CHANGES { color: var(--changes); background: var(--changes-bg); border-color: transparent; }
  .chip.waiting { border-style: dashed; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .chip.waiting { animation: none; } }

  .welcome { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 32px 0 0; }
  .welcome code { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .25); display: none; }
  .scrim.open { display: block; }
  aside {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, .12);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%); transition: transform .18s ease;
  }
  aside.open { transform: none; }
  .d-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .d-head .title { font-weight: 600; }
  .d-head .id { font: 12px var(--mono); color: var(--muted); }
  .close { margin-left: auto; border: 1px solid var(--line); background: var(--sunken); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
  .files .group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin: 10px 6px 4px; }
  .files button {
    display: flex; justify-content: space-between; width: 100%; border: 0; background: none; color: var(--text);
    font: 13px/1.3 inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left;
  }
  .files button:hover { background: var(--sunken); }
  .files button.on { background: var(--sunken); font-weight: 600; }
  .files button.missing { color: var(--faint); cursor: default; }
  .doc { overflow: auto; padding: 18px 26px 40px; }
  .doc h1 { font-size: 20px; } .doc h2 { font-size: 15px; margin-top: 22px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--sunken); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; overflow: auto; font: 12px/1.5 var(--mono); }
  .doc code { font: 12px var(--mono); background: var(--sunken); padding: 1px 4px; border-radius: 3px; }
  .doc pre code { background: none; padding: 0; }
  .doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .doc a { color: var(--accent); }
  .verdict { display: inline-block; font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 3px 10px; border-radius: 99px; margin-bottom: 4px; }
  .verdict.good { color: var(--pass); background: var(--pass-bg); }
  .verdict.bad { color: var(--changes); background: var(--changes-bg); }

  @media (max-width: 760px) {
    header { padding: 16px 16px 4px; }
    .board { grid-template-columns: 1fr; padding: 12px 16px 24px; }
    .col { min-height: 0; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
    .doc { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Software factory</h1>
  <span class="sub">spec → build → 4 reviews → approver → main</span>
  <span class="live"><span class="dot" id="dot"></span><span id="updated">connecting…</span></span>
</header>
<main class="board" id="board"></main>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="d-head">
    <div><div class="id" id="d-id"></div><div class="title" id="d-title"></div></div>
    <button class="close" id="d-close">Close</button>
  </div>
  <div class="d-body">
    <nav class="files" id="d-files"></nav>
    <article class="doc" id="d-doc"></article>
  </div>
</aside>
<script>
const STAGES = [
  { key: "spec", label: "Spec", who: "opus" },
  { key: "build", label: "Build", who: "opus" },
  { key: "review", label: "Review", who: "4 agents" },
  { key: "approve", label: "Approve", who: "opus" },
  { key: "needs-human", label: "Needs human", who: "you" },
  { key: "merged", label: "Merged", who: "main" },
];
const REVIEWERS = [["security", "Security"], ["ux", "UX"], ["ui", "UI design"], ["code", "Code"]];
const SHORT = { security: "Sec", ux: "UX", ui: "UI", code: "Code" };

let board = { jobs: [] }, lastText = "", lastOk = 0, openJob = null, openFile = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = iso => {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
};

async function poll() {
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    const text = res.ok ? await res.text() : '{"jobs": []}';
    lastOk = Date.now();
    if (text !== lastText) {
      lastText = text;
      board = JSON.parse(text);
      render();
      if (openJob) refreshDrawer();
    }
  } catch (e) { /* keep the last good board; the dot goes stale */ }
  const dot = document.getElementById("dot");
  dot.classList.toggle("stale", Date.now() - lastOk > 6000);
  document.getElementById("updated").textContent = lastOk
    ? (board.updated ? "board updated " + ago(board.updated) : "no jobs yet")
    : "cannot reach board.json";
}

function chips(reviews, live) {
  return REVIEWERS.map(([k, label]) => {
    const v = (reviews || {})[k] || "pending";
    return `<span class="chip ${v} ${live && v === "pending" ? "waiting" : ""}" title="${label}: ${v}">${SHORT[k]}</span>`;
  }).join("");
}

function card(job) {
  const rows = (job.history || []).map((r, i) => `<div class="round"><span class="r">R${i + 1}</span>${chips(r, false)}</div>`);
  if (job.round > 0) rows.push(`<div class="round"><span class="r">R${job.round}</span>${chips(job.reviews, job.stage === "review")}</div>`);
  const human = job.stage === "needs-human";
  const meta = [job.round ? "round " + job.round : "", job.fixes ? `fixes ${job.fixes}/2` : "", ago(job.updated)].filter(Boolean).join(" · ");
  return `<button class="card ${human ? "human" : ""}" data-id="${esc(job.id)}">
    <div class="id">${esc(job.id)}</div>
    <div class="title">${esc(job.title)}</div>
    <div class="meta">${esc(meta)}</div>
    ${rows.length ? `<div class="rounds">${rows.join("")}</div>` : ""}
    ${job.note ? `<div class="note">${esc(job.note)}</div>` : ""}
  </button>`;
}

function render() {
  const el = document.getElementById("board");
  const jobs = board.jobs || [];
  el.innerHTML = STAGES.map(s => {
    const mine = jobs.filter(j => j.stage === s.key).sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
    return `<section class="col ${s.key === "needs-human" ? "human" : ""}">
      <div class="col-head"><span>${s.label} <span class="who">${s.who}</span></span><span class="count">${mine.length}</span></div>
      <div class="cards">${mine.map(card).join("") || `<div class="empty-col">—</div>`}</div>
    </section>`;
  }).join("") + (jobs.length ? "" : `<div class="welcome">No jobs yet. Run <code>/factory &lt;feature&gt;</code> or <code>/factory next</code> in Claude Code.</div>`);
  el.querySelectorAll(".card").forEach(c => c.onclick = () => openDrawer(c.dataset.id));
}

// ---------- Drawer ----------
function filesFor(job) {
  const out = [{ group: "Job", path: "spec.md", label: "Spec" }, { group: "Job", path: "build.md", label: "Build" }];
  for (let k = 1; k <= (job.reworks || 0); k++) out.push({ group: "Job", path: `rework-${k}.md`, label: `Rework note ${k}` });
  for (let r = 1; r <= (job.round || 0); r++)
    for (const [k, label] of REVIEWERS) out.push({ group: `Round ${r}`, path: `round-${r}/review-${k}.md`, label });
  out.push({ group: "Decision", path: "decision.md", label: "Decision" });
  return out;
}

const cache = {};
async function load(job, path) {
  const url = `jobs/${encodeURIComponent(job.id)}/${path}`;
  try {
    const res = await fetch(url, { cache: "no-store" });
    cache[url] = res.ok ? await res.text() : null;
  } catch { cache[url] = null; }
  return cache[url];
}

function openDrawer(id) {
  openJob = id; openFile = null;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer").setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("open");
  refreshDrawer();
}
function closeDrawer() {
  openJob = null;
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer").setAttribute("aria-hidden", "true");
  document.getElementById("scrim").classList.remove("open");
}

async function refreshDrawer() {
  const job = (board.jobs || []).find(j => j.id === openJob);
  if (!job) return closeDrawer();
  document.getElementById("d-id").textContent = `${job.id} · ${job.branch || ""}`;
  document.getElementById("d-title").textContent = job.title;
  const files = filesFor(job);
  const texts = await Promise.all(files.map(f => load(job, f.path)));
  if (!openFile || texts[files.findIndex(f => f.path === openFile)] == null) {
    const present = files.filter((f, i) => texts[i] != null);
    openFile = present.length ? present[present.length - 1].path : files[0].path;
  }
  let group = "";
  document.getElementById("d-files").innerHTML = files.map((f, i) => {
    const head = f.group !== group ? `<div class="group">${esc(group = f.group)}</div>` : "";
    const v = texts[i] != null ? (texts[i].split("\n")[0].match(/PASS|CHANGES|APPROVE|ESCALATE/) || [""])[0] : "";
    const tag = v ? `<span class="chip ${v === "PASS" || v === "APPROVE" ? "PASS" : "CHANGES"}">${v}</span>` : "";
    return `${head}<button data-path="${esc(f.path)}" class="${f.path === openFile ? "on" : ""} ${texts[i] == null ? "missing" : ""}">${esc(f.label)}${tag}</button>`;
  }).join("");
  document.querySelectorAll("#d-files button").forEach((b, i) => b.onclick = () => {
    if (texts[i] == null) return;
    openFile = b.dataset.path; refreshDrawer();
  });
  const text = texts[files.findIndex(f => f.path === openFile)];
  document.getElementById("d-doc").innerHTML = text == null
    ? `<p class="sub">Not written yet.</p>` : md(text);
}

// ---------- Tiny markdown renderer (headings, lists, code, tables, inline) ----------
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const first = lines[0]?.trim() || "";
  const verdict = first.match(/^(VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\b/);
  if (verdict) {
    out.push(`<div class="verdict ${["PASS", "APPROVE"].includes(verdict[2]) ? "good" : "bad"}">${esc(first)}</div>`);
    i = 1;
  }
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push("<table>" + body.map((r, n) => "<tr>" + cells(r).map(c => n ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) item += " " + lines[i++].trim();
        items.push(`<li>${inline(item)}</li>`);
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^\s*<!--/.test(line)) { while (i < lines.length && !lines[i].includes("-->")) i++; i++; continue; }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

document.getElementById("d-close").onclick = closeDrawer;
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
