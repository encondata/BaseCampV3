# Which of the newer optional apps this checkout's ss-stack doesn't know:
# sets apps_unknown (a list; empty without ss_stack). Its STACK_APPS check
# refuses any app it doesn't know. learn arrived in 6cc4c8b7, devices in
# 79674823f. The names sat in a case line (`wiki|kiosk|learn|status|mailpit) ;;`)
# until 4e8ceb1d4 moved them to OPTIONAL_APPS=(wiki kiosk ...); either form
# counts. Input: apps_asked, the apps the play wants (only those are checked).
- name: Does this checkout's ss-stack know the app?
  ansible.builtin.command:
    argv: [grep, -qE,
           -e, "^ +([a-z]+[|])*{{ item }}([|][a-z]+)*[)]",
           -e, "^OPTIONAL_APPS=\\(.*\\b{{ item }}\\b.*\\)",
           "{{ ss_stack }}"]
  loop: [learn, devices]
  register: knows_app
  changed_when: false
  failed_when: false
  when: ss_stack is defined and item in apps_asked

- name: The apps it doesn't
  ansible.builtin.set_fact:
    apps_unknown: >-
      {{ knows_app.results | selectattr('rc', 'defined') | rejectattr('rc', 'eq', 0)
         | map(attribute='item') | list }}
