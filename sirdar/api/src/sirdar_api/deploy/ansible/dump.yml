# Step 6 — Pre-deploy dump (Update, including a seeded first deploy, which
# backs up a database already on the host before the restore drops it).
# Skipped when the environment's database isn't running and Sirdar says the
# dump isn't required (a first deploy usually has nothing to dump). An
# environment that has deployed before (dump_required) fails here instead:
# "up" would migrate with no backup. So does a deployment that restores a
# snapshot onto a database volume whose container is stopped.
# On DigitalOcean (external_data) the managed database is dumped through
# ss-stack's one-off client; so is a LAN Blue/Green data VM, from the slot's
# app VM, unless this deploy just built it (data_new: no dump, dump_path '').
# Reports the dump's path to Sirdar through set_stats.
#
# LAN Blue/Green: before the dump, Sirdar runs this playbook on the data VM
# with data_hba (and only that part runs there). An Update to an older
# commit ran that commit's ss-stack data, which may have written
# pg_hba.conf without the devices database's lines; step 7 (which runs data
# again) comes after this dump, so the app VM's dump of the devices database
# would be refused. This commit's own ss-stack (checked out here, as step 7
# would) writes the file as its data would, and Postgres rereads it only
# when it changed. A commit whose ss-stack has no hba command doesn't dump
# the devices database, so nothing needs changing for it.
- name: Pre-deploy dump
  hosts: target
  gather_facts: false
  tasks:
    - name: The data VM's pg_hba.conf
      when: data_hba | default(false) | bool
      block:
        - name: Check out the commit (the stack's files)
          ansible.builtin.git:
            repo: "{{ repo_url }}"
            dest: "{{ env_dir }}/repo"
            version: "{{ sha }}"
            force: false

        - name: Does this checkout's ss-stack have the hba command?
          ansible.builtin.command:
            argv: [grep, -q, "^  hba)", "{{ ss_stack }}"]
          register: knows_hba
          changed_when: false
          failed_when: false

        - name: Say so when it doesn't
          ansible.builtin.debug:
            msg: >-
              This commit's ss-stack has no hba command, and its dump leaves the
              devices database out: the data VM's pg_hba.conf stays as it is
              until step 7.
          when: knows_hba.rc != 0

        - name: ss-stack hba
          ansible.builtin.command:
            argv: ["{{ ss_stack }}", hba, "{{ env_dir }}"]
          register: hba
          changed_when: hba.stdout is search('updated')
          when: knows_hba.rc == 0

        - name: Say what changed
          ansible.builtin.debug:
            msg: "{{ hba.stdout_lines[-1] }}"
          when: hba is not skipped

    - name: Only that, on the data VM
      ansible.builtin.meta: end_play
      when: data_hba | default(false) | bool

    # DigitalOcean: the managed database is always running, so the dump always
    # happens (a first deploy dumps an empty database).
    - name: ss-stack dump (the managed database)
      ansible.builtin.command:
        argv: ["{{ ss_stack }}", dump, "{{ env_dir }}"]
      register: managed_dump
      when:
        - external_data | default(false) | bool
        # a LAN Blue/Green data VM built by this very deploy has nothing to dump
        - not (data_new | default(false) | bool)

    - name: The local database
      when: not (external_data | default(false) | bool)
      block:
        - name: Is the database running?
          ansible.builtin.command:
            argv:
              - docker
              - ps
              - --quiet
              - --filter
              - "label=com.docker.compose.project=ss-{{ env_name }}-db"
              - --filter
              - status=running
          register: db_running
          changed_when: false

        # A deployment that restores a snapshot (a seeded first deploy) would
        # start a stopped database's volume (`ss-stack data`) and drop it
        # (`ss-stack restore`) without this dump: refuse before anything changes.
        - name: Is there a stopped database?
          ansible.builtin.command:
            argv: [docker, volume, inspect, "ss-{{ env_name }}-db_pgdata"]
          register: db_volume
          changed_when: false
          failed_when: false
          when:
            - restores_snapshot | default(false) | bool
            - db_running.stdout | length == 0

        - name: Stop before the restore drops it
          ansible.builtin.fail:
            msg: >-
              A database for {{ env_name }} already exists on this server but isn't running.
              Adopt the environment instead, or remove its volume (ss-{{ env_name }}-db_pgdata).
          when:
            - db_volume is not skipped
            - db_volume.rc == 0

        - name: Stop when the backup can't be taken
          ansible.builtin.fail:
            msg: >-
              The database isn't running, so the pre-deploy backup can't be taken.
              Start it (or Reset) and retry.
          when:
            - dump_required | default(false) | bool
            - db_running.stdout | length == 0

        - name: ss-stack dump
          ansible.builtin.command:
            argv: ["{{ ss_stack }}", dump, "{{ env_dir }}"]
          register: dump
          when: db_running.stdout | length > 0

    - name: Report the dump path
      ansible.builtin.set_stats:
        data:
          dump_path: >-
            {{ managed_dump.stdout_lines[-1] if managed_dump is not skipped
               else (dump.stdout_lines[-1] if dump is defined and dump is not skipped
                     else '') }}
        per_host: false
        aggregate: true
