# Step 6 — Pre-deploy dump (Update, including a seeded first deploy, which
# backs up a database already on the host before the restore drops it).
# Skipped when the environment's database isn't running and Sirdar says the
# dump isn't required (a first deploy usually has nothing to dump). An environment that has deployed before
# (dump_required) fails here instead: "up" would migrate with no backup.
# Reports the dump's path to Sirdar through set_stats.
- name: Pre-deploy dump
  hosts: target
  gather_facts: false
  tasks:
    - name: Is the database running?
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - "label=com.docker.compose.project=ss-{{ env_name }}-db"
          - --filter
          - status=running
      register: db_running
      changed_when: false

    - name: Stop when the backup can't be taken
      ansible.builtin.fail:
        msg: >-
          The database isn't running, so the pre-deploy backup can't be taken.
          Start it (or Reset) and retry.
      when:
        - dump_required | default(false) | bool
        - db_running.stdout | length == 0

    - name: ss-stack dump
      ansible.builtin.command:
        argv: ["{{ ss_stack }}", dump, "{{ env_dir }}"]
      register: dump
      when: db_running.stdout | length > 0

    - name: Report the dump path
      ansible.builtin.set_stats:
        data:
          dump_path: "{{ dump.stdout_lines[-1] if dump is not skipped else '' }}"
        per_host: false
        aggregate: true
