# Step 13 — Smoke test (slot), DigitalOcean: every public name answers
# through Caddy on this droplet (http://127.0.0.1 with its Host), before the
# load balancer sends it any traffic. Sirdar isn't in the VPC, so the check
# runs on the droplet. 200–399 passes; redirects aren't followed. Worst
# case for the seven public names (api, portal, kiosk, wiki, learn, status,
# devices): 7 × (5 tries × 5 s + 4 waits × 10 s) = 455 s, inside the step's
# 10 minutes.
# On a LAN Blue/Green app VM each name carries its own port (no Caddy).
# A checkout from before the learning site or the Devices app runs without
# them (render.yml), so their names aren't tried.
- name: Smoke test (slot)
  hosts: target
  gather_facts: false
  tasks:
    - name: Which newer apps this checkout's ss-stack doesn't know
      ansible.builtin.include_tasks: tasks/known_apps.yml
      vars:
        apps_asked: "{{ public_hosts | map(attribute='service') | list }}"

    - name: Each public name answers through Caddy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.port | default(slot_port | default(80)) }}{{ item.path }}"
        headers:
          Host: "{{ item.hostname }}"
          X-Forwarded-Proto: https
        follow_redirects: none
        status_code: [200, 201, 202, 203, 204, 301, 302, 303, 304, 307, 308]
        timeout: 5
      register: answer
      until: answer is not failed
      retries: "{{ slot_smoke_retries | default(4) }}"
      delay: "{{ slot_smoke_delay | default(10) }}"
      loop: "{{ public_hosts | rejectattr('service', 'in', apps_unknown) | list }}"
      loop_control:
        label: "{{ item.hostname }}"
