# Step 4 — Render config: the environment's .env (mode 600) from Sirdar's
# record. It arrives base64-encoded so no value is ever read as a template,
# and it carries every secret, so the tasks that read it are no_log.
# A checkout from before the learning site or the Devices app (its ss-stack's
# STACK_APPS check refuses any app it doesn't know: tasks/known_apps.yml)
# runs without them, so Roll back, Update, Restore backup and adopt to an
# older commit still start.
- name: Render config
  hosts: target
  gather_facts: false
  tasks:
    - name: Backups folder
      ansible.builtin.file:
        path: "{{ env_dir }}/backups"
        state: directory
        mode: "0700"

    - name: Which apps the .env runs
      ansible.builtin.set_fact:
        stack_apps: >-
          {{ ((env_file_b64 | b64decode
               | regex_search('(?m)^STACK_APPS=(.*)$', '\1')) or ['none'])[0]
             | trim }}
      no_log: true

    - name: Which newer apps this checkout's ss-stack doesn't know
      ansible.builtin.include_tasks: tasks/known_apps.yml
      vars:
        apps_asked: "{{ stack_apps.split(',') }}"

    - name: Run without them
      ansible.builtin.set_fact:
        apps_kept: "{{ stack_apps.split(',') | reject('in', apps_unknown) | join(',') or 'none' }}"

    - name: Say so
      ansible.builtin.debug:
        msg: >-
          {{ {'learn': 'This commit predates the learning site, so it runs without it.',
              'devices': 'This commit predates the Devices app, so it runs without it.'}[item] }}
      loop: "{{ apps_unknown }}"

    - name: Write .env
      ansible.builtin.copy:
        content: >-
          {{ (env_file_b64 | b64decode
              | regex_replace('(?m)^STACK_APPS=.*$', 'STACK_APPS=' ~ apps_kept))
             if apps_unknown else (env_file_b64 | b64decode) }}
        dest: "{{ env_dir }}/.env"
        mode: "0600"
      no_log: true
