# Step 2 — Bootstrap. Idempotent: installs what is missing (git, Docker with
# the Compose plugin), lets the SSH user run docker, and creates the
# environment folder owned by that user. Root work goes through sudo.
- name: Bootstrap
  hosts: target
  gather_facts: true
  tasks:
    - name: Base packages
      ansible.builtin.apt:
        name: [git, ca-certificates, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Look for Docker
      ansible.builtin.command:
        argv: [docker, --version]
      register: docker_cli
      changed_when: false
      failed_when: false

    - name: Look for the Compose plugin
      ansible.builtin.command:
        argv: [docker, compose, version]
      register: compose_cli
      changed_when: false
      failed_when: false

    - name: Install Docker
      when: docker_cli.rc != 0 or compose_cli.rc != 0
      become: true
      block:
        - name: Download the Docker install script
          ansible.builtin.get_url:
            url: https://get.docker.com
            dest: /root/sirdar-get-docker.sh
            mode: "0700"

        - name: Run the Docker install script
          ansible.builtin.command:
            argv: [sh, /root/sirdar-get-docker.sh]

        - name: Remove the install script
          ansible.builtin.file:
            path: /root/sirdar-get-docker.sh
            state: absent

    - name: Docker starts on boot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      become: true

    # DigitalOcean: the droplet's user-data holds its SSH host key, and the
    # metadata service hands user-data to anything on the droplet. Containers
    # never need it: reject their traffic to it, now and after every Docker
    # (re)start.
    - name: Containers can't reach the metadata service
      when: block_metadata | default(false) | bool
      become: true
      block:
        - name: The rule's unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/sirdar-metadata-block.service
            mode: "0644"
            content: |
              [Unit]
              Description=Keep containers away from the DigitalOcean metadata service (Sirdar)
              After=docker.service
              Requires=docker.service
              PartOf=docker.service

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/sh -c 'iptables -C DOCKER-USER -d 169.254.169.254 -j REJECT 2>/dev/null || iptables -I DOCKER-USER -d 169.254.169.254 -j REJECT'

              [Install]
              WantedBy=multi-user.target

        - name: The rule is on, and comes back with Docker
          ansible.builtin.systemd_service:
            name: sirdar-metadata-block
            enabled: true
            state: restarted
            daemon_reload: true

    - name: The SSH user may run docker
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: [docker]
        append: true
      become: true
      when: ansible_facts['user_id'] != 'root'

    - name: Environments folder
      ansible.builtin.file:
        path: /opt/serversherpa
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Environment folder, owned by the SSH user
      ansible.builtin.file:
        path: "{{ env_dir }}"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0750"
      become: true

    - name: Pick up the docker group on the next connection
      ansible.builtin.meta: reset_connection

    - name: Docker answers without sudo
      ansible.builtin.command:
        argv: [docker, ps, --quiet]
      changed_when: false
