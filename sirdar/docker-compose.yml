# Sirdar — two containers: the app (API + SPA) and its own Postgres.
# Normally installed and updated with sirdar/install.sh (see sirdar/README.md).
# By hand:
#   cp sirdar/.env.example sirdar/.env   # then edit it
#   docker compose -f sirdar/docker-compose.yml --env-file sirdar/.env up -d --build
#   docker compose -f sirdar/docker-compose.yml --env-file sirdar/.env exec sirdar sirdar create-admin --email … --first-name … --last-name …
#   docker compose -f sirdar/docker-compose.yml --env-file sirdar/.env exec sirdar sirdar import-users

# Listen address: SIRDAR_BIND (default 127.0.0.1 = this machine only). Set it to
# 0.0.0.0 (all interfaces) or a host IP when the reverse proxy runs elsewhere;
# the app serves plain HTTP, so keep an HTTPS proxy in front.

name: sirdar

services:
  sirdar:
    build:
      context: ..
      dockerfile: sirdar/Dockerfile
    env_file: .env
    environment:
      SIRDAR_DATABASE_URL: postgresql+asyncpg://sirdar:${SIRDAR_DB_PASSWORD:?set SIRDAR_DB_PASSWORD in sirdar/.env}@sirdar-db:5432/sirdar
      # In the container the keys always live at the mount point, even when
      # SIRDAR_DEPLOY_KEYS_DIR in .env names the host folder.
      SIRDAR_DEPLOY_KEYS_DIR: /app/deploy-keys
      # Saved SSH targets (written by the Deploy page).
      SIRDAR_DEPLOY_TARGETS_FILE: /app/config/deploy-targets.env
      # Deploy runs: one private Ansible folder per step, deleted afterwards.
      SIRDAR_RUNNER_DIR: /app/runner
      # Snapshot bundles (database, files and encrypted sign-in keys).
      SIRDAR_SNAPSHOTS_DIR: /app/snapshots
      # Proxmox environments: one Terraform folder (state included) each.
      SIRDAR_TERRAFORM_DIR: /app/terraform
    volumes:
      # Deploy-page SSH/GCP key files; the container runs as uid 10001.
      - ${SIRDAR_DEPLOY_KEYS_DIR:-./deploy-keys}:/app/deploy-keys:ro
      # Saved SSH targets: the whole folder is writable by uid 10001 (the app
      # renames a temp file over deploy-targets.env, so a file mount won't do).
      - ./config:/app/config
      # Deploy run folders hold a run's secrets while it runs: owned by uid
      # 10001, mode 700 (the installer sets that up).
      - ./runner:/app/runner
      # Snapshot bundles hold whole databases: owned by uid 10001, mode 700
      # (the installer sets that up). Back this folder up if you need them.
      - ./snapshots:/app/snapshots
      # Terraform state for Proxmox VMs: owned by uid 10001, mode 700 (the
      # installer sets that up). Losing it means VMs must be removed by hand.
      - ./terraform:/app/terraform
    ports:
      - "${SIRDAR_BIND:-127.0.0.1}:${SIRDAR_PORT:-8098}:8080"   # put the reverse proxy in front
    depends_on:
      sirdar-db:
        condition: service_healthy
    # The app waits up to 35 s for running deployments to stop on shutdown;
    # Docker's default 10 s grace would kill it first.
    stop_grace_period: 45s
    restart: unless-stopped

  sirdar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sirdar
      POSTGRES_PASSWORD: ${SIRDAR_DB_PASSWORD:?set SIRDAR_DB_PASSWORD in sirdar/.env}
      POSTGRES_DB: sirdar
    volumes:
      - sirdar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirdar -d sirdar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sirdar-db:
