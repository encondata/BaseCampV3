[project]
name = "serversherpa-edge"
version = "0.1.0"
description = "ServerSherpa kiosk laptop edition — local edge API (FastAPI + SQLite)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests import their helpers as `tests.*`; `pytest` (unlike `python -m pytest`)
# does not put this folder on sys.path by itself
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src"]
