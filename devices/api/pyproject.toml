[project]
name = "serversherpa-devices"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",          # runtime driver
    "psycopg[binary]>=3.1",   # Alembic + tests
    "boto3>=1.34",
    "cryptography>=46",
    "pyjwt[crypto]>=2.9",
    "asn1crypto>=1.5",
    "androguard>=4.1.4,<5",
    "httpx>=0.27",
    "typer>=0.12",
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
devices = "serversherpa_devices.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
