[project]
name = "serversherpa-api"
version = "0.1.0"
description = "ServerSherpa backend — FastAPI application, worker, and CLI"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",          # runtime driver (API)
    "psycopg[binary]>=3.1",   # sync driver (Alembic migrations)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "typer>=0.12",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
serversherpa = "serversherpa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
