# ServerSherpa — local development stack
# Stands in for the DigitalOcean managed services used in production:
#   postgres → DO Managed Postgres
#   minio    → DO Spaces (S3-compatible)
#   mailpit  → real SMTP provider (catches all outbound mail, UI at :8025)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # keep data
#   docker compose -f docker-compose.dev.yml down -v     # wipe data

name: serversherpa-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"  # 5433 on host: a pre-existing system Postgres owns 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # S3 API is the one service reachable off-box: presigned URLs are signed
      # for a host, so a phone/laptop testing the portal over the LAN must be
      # able to fetch images from that same host. Set SS_SPACES_ENDPOINT to the
      # dev box's LAN address to match. Everything else stays on loopback.
      - "9000:9000"             # S3 API — LAN-reachable
      - "127.0.0.1:9001:9001"   # web console — localhost only (admin surface)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the dev bucket, then exits
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/serversherpa-dev
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1026:1025"   # SMTP (1026 on host: macOS FinderSync owns 1025)
      - "127.0.0.1:8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "127.0.0.1:3100:3100"   # push target for the log-service
    volumes:
      - lokidata:/loki

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3000:3000"   # log UI — Explore, Loki datasource
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    depends_on:
      - loki

volumes:
  pgdata:
  miniodata:
  lokidata:
  grafanadata:
